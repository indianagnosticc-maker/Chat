<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuki · Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #f7d6e6 0%, #e2ecf9 50%, #d5e5fa 100%);
  --card-bg: #ffffff;
  --primary-blue: #1d72fe;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --border-subtle: #e2e8f0;
  --shadow-lg: 0 16px 36px rgba(30, 41, 59, 0.12);
  --radius-xl: 24px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100dvh;
  background: var(--bg-gradient);
  font-family: "Inter", sans-serif;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
}
.auth-shell {
  width: 100%;
  max-width: 420px;
  background: var(--card-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 40px 28px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}
.brand-badge {
  width: 64px; height: 64px; border-radius: 50%;
  overflow: hidden; margin: 0 auto 16px;
  background: var(--primary-blue);
}
.brand-badge img { width: 100%; height: 100%; object-fit: cover; }
h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
p.sub { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }

/* Google Button ke liye container */
.google-btn-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  overflow: hidden; /* Box ke bahar nahi jayega */
  border-radius: 24px;
}

/* Google ke iframe ko box ke andar fit karne ke liye */
.google-btn-wrap iframe {
  max-width: 100%;
  margin: 0 auto;
  border-radius: 24px !important;
}

#g_id_onload { display: none; }
.g_id_signin { display: flex; justify-content: center; width: 100%; }
.auth-msg-err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 16px; font-weight: 500; }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="brand-badge">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4sBVUR8Nz47PlRnmU7Mn9yBzGxjtHQbmswmVJ8g5JBLmgwhevUrlEWaiPvzu5NGe_l3mKI1oWJzedHAZUWp_1iqSxEfaynl9A6aduhVIbZY_4KOtC4c22tAzKQJYC1E7gQtuq_k0JbQTLEPWTB2buOrT_ts7cIa-kfTMx_dbvLkbqkM7D00p3E_VLcpHPW49Vuv8tc_TAMxQCZGc2hpKdGpIkXY9j6A6mDYHzquEG8yWXaVh_tMpOUw" alt="Yuki">
  </div>
  <h1>Yuki</h1>
  <p class="sub">Sign in to continue to your messages</p>

  <div class="google-btn-wrap">
    <!-- Google GIS Button -->
    <div id="g_id_onload"
         data-client_id="97759085922-vu8a92l03dp86sdivb4llb0hkjhqd88a.apps.googleusercontent.com"
         data-callback="handleGoogleCredential"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="continue_with"
         data-shape="pill"
         data-logo_alignment="center"
         data-width="280">
    </div>
  </div>

  <div class="auth-msg-err" id="authError"></div>
</div>

<!-- Load Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
         GoogleAuthProvider, signInWithCredential } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZWHHSGkbdN5NLRdBKwecHHf7m2yu5cAk",
  authDomain: "yuki-820b3.firebaseapp.com",
  projectId: "yuki-820b3",
  storageBucket: "yuki-820b3.firebasestorage.app",
  messagingSenderId: "1055284096143",
  appId: "1:1055284096143:web:f9463859371eb606db14fa"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
setPersistence(auth, browserLocalPersistence).catch(() => {});

const $ = id => document.getElementById(id);
const CHATS_PAGE = 'Chat.html';

let redirecting = false;
function goToChats() {
  if (redirecting) return;
  redirecting = true;
  window.location.replace(CHATS_PAGE);
}

/* ---------- Google GIS Callback ---------- */
window.handleGoogleCredential = async (response) => {
  const errEl = $('authError');
  errEl.textContent = 'Signing in…';

  try {
    const credential = GoogleAuthProvider.credential(response.credential);
    await signInWithCredential(auth, credential);
    // Redirect immediately after Firebase confirms authentication.
    // Firestore profile sync must never block navigation to Chat.html.
    goToChats();
  } catch (err) {
    console.error('Google sign-in error:', err);
    errEl.textContent = 'Sign-in failed. Please try again.';
  }
};

/* ---------- Auth state: profile sync & redirect ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) return;
  $('authError').textContent = '';

  // If Firebase restores an existing session on page load, navigate immediately.
  // Do not wait for Firestore profile work before opening the chat UI.
  goToChats();

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) {
      const h = (user.email ? user.email.split('@')[0] : 'operator')
        .replace(/[^a-zA-Z0-9_]/g, '_').toLowerCase().slice(0, 20) || 'operator';
      await setDoc(doc(db, 'users', user.uid), {
        username: h,
        display: user.displayName || h.toUpperCase(),
        email: user.email || '',
        photoURL: user.photoURL || '',
        createdAt: serverTimestamp(),
        lastSeen: serverTimestamp(),
        emailVerified: true
      }, { merge: true });
      await setDoc(doc(db, 'usernames', h), { uid: user.uid }, { merge: true });
    } else {
      await setDoc(doc(db, 'users', user.uid), {
        lastSeen: serverTimestamp(),
        emailVerified: true
      }, { merge: true });
    }
  } catch (e) { console.warn('Profile sync:', e); }

});
</script>
</body>
</html>
